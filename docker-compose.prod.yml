# Production stack for GEO: backend (api-web + api-worker) AND the embedded
# Shopify Remix app (web), all sharing ONE Postgres/Redis.
#
#   nginx (TLS) ─► api.<domain> → api-web:3000   (backend / WordPress + Shopify API)
#   nginx (TLS) ─► app.<domain> → web:3000       (embedded Shopify Remix app)
#   api-worker ──► Redis + Postgres              (BullMQ jobs, all LLM calls)
#   migrate (one-shot) applies @geo/db migrations before api-web/web start.
#
# Deploy on the server:
#   cp .env.prod.example .env   # then fill in real values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# api-web/api-worker share the geo-api image; web is a separate geo-web image.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-geo_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. api-web waits for this to succeed.
  migrate:
    image: geo-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@geo/db", "migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-web:
    image: geo-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@geo/api", "start"]
    env_file: .env
    # Bound to localhost only: a host-level reverse proxy (nginx/Caddy) fronts
    # this and terminates TLS for API_DOMAIN. Not published to the public IP.
    # Host port is configurable (API_HOST_PORT) to avoid clashes with co-hosted
    # apps; keep deploy/nginx-api.conf's proxy_pass in sync with it.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8770}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api-worker:
    image: geo-api:latest
    # No build here — reuses the image built by api-web/migrate.
    command: ["pnpm", "--filter", "@geo/api", "worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Embedded Shopify Remix app. Shares the DB with the backend (it writes the
  # tenant + offline token on install, which the worker then reads). Talks to the
  # API over the internal compose network (no public hop). Fronted by nginx at
  # app.<domain>. Does NOT run migrations (the migrate service owns the schema).
  web:
    image: geo-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      # Reach the API internally; overrides any GEO_API_URL in .env.
      GEO_API_URL: "http://api-web:3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8780}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

# TLS + public routing is handled by the host's reverse proxy (see
# deploy/nginx-api.conf), which proxies api.<domain> to 127.0.0.1:3000. This
# server co-hosts other nginx sites, so the stack does not bind :80/:443 itself.

volumes:
  pgdata:
  redisdata:
