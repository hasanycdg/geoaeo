# nginx server block for the GEO API on a shared host (co-hosted with other
# sites). Proxies api.<domain> to the api-web container bound at 127.0.0.1:3000.
#
# Install on the server:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/api.getbrandradar.com
#   sudo ln -s /etc/nginx/sites-available/api.getbrandradar.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.getbrandradar.com     # adds the TLS/443 block + redirect
#
# certbot rewrites this file to add `listen 443 ssl` + cert paths and an
# http->https redirect. Do NOT touch the other sites' configs.
server {
    listen 80;
    listen [::]:80;
    server_name api.getbrandradar.com;

    location / {
        # Must match API_HOST_PORT in .env (default 8770).
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
