# nginx server block for the embedded Shopify Remix app on a shared host.
# Proxies app.<domain> to the `web` container bound at 127.0.0.1:8780.
#
# Install on the server:
#   sudo cp deploy/nginx-app.conf /etc/nginx/sites-available/app.getbrandradar.com
#   sudo ln -s /etc/nginx/sites-available/app.getbrandradar.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.getbrandradar.com     # adds the TLS/443 block + redirect
#
# certbot rewrites this file to add `listen 443 ssl` + cert paths and an
# http->https redirect. Requires a DNS A-record for app.getbrandradar.com → this server.
server {
    listen 80;
    listen [::]:80;
    server_name app.getbrandradar.com;

    location / {
        # Must match WEB_HOST_PORT in .env (default 8780).
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
